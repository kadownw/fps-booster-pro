[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fps-booster"
version = "0.1.0"
description = "Optimizador de rendimiento para juegos en Windows 10/11, seguro y reversible."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6"]

[project.gui-scripts]
fps-booster = "fps_booster.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "ui: pruebas de interfaz (Qt offscreen)",
    "windows: requiere Windows real (solo lectura)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S603", "S607", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
